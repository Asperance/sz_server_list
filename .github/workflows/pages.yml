name: Update server list and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "7 0,12 * * *"
permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--dns-result-order=ipv4first"

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Diagnose Russian source connectivity
        continue-on-error: true
        shell: bash
        run: |
          echo "IPv4 DNS records:"
          getent ahostsv4 backend.stalcraftx.ru || true
          echo "HTTPS probe:"
          curl --ipv4 --silent --show-error             --output /dev/null             --connect-timeout 10             --max-time 20             --write-out "protocol=https status=%{http_code} remote=%{remote_ip} dns=%{time_namelookup}s connect=%{time_connect}s total=%{time_total}s\n"             "https://backend.stalcraftx.ru/address_list?login=Hi" || true

          echo "HTTP fallback probe:"
          curl --ipv4 --silent --show-error             --output /dev/null             --connect-timeout 10             --max-time 20             --write-out "protocol=http status=%{http_code} remote=%{remote_ip} dns=%{time_namelookup}s connect=%{time_connect}s total=%{time_total}s\n"             "http://backend.stalcraftx.ru/address_list?login=Hi" || true

      - name: Fetch server and network data
        timeout-minutes: 3
        run: node scripts/fetch-servers.mjs

      - name: Save latest data snapshot
        continue-on-error: true
        shell: bash
        run: |
          if git diff --quiet -- public/data/ip-cache.json public/data/servers.json; then
            echo "Data snapshot has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ip-cache.json public/data/servers.json
          git commit -m "Update server snapshot [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
